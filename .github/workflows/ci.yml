name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Prisma client
        run: npx prisma generate

      - name: ESLint (app src)
        run: npx eslint "src/**/*.{ts,tsx}" --quiet

      - name: Typecheck
        run: npx tsc --noEmit
